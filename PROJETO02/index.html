<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 02 - Grid Responsivos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container my-5">
        <h2 class="text-center mb-4">Galeria Responsiva</h2>

        <!-- adiciona espaçamento (gutter) entre as colunas -->
         <div class="row g-4">
            <div class="col-12 col-md-6 md-lg-4">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/400x250/0d6efd/ffffff?text=Foto+1" class="card-img-top" alt="Foto 1">
                    <div class="card-body">
                        <h5 class="card-title">Item</h5>
                        <p class="card-text">Redimensioe a janela do navegador para ver as colunas se reorganizando.</p>
                    </div>
                </div>
            </div>
         </div>
    </div>
</body>
</html>
