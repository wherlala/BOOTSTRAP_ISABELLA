<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto 02-grid responsivo</title>
    <link rel="stylesheet" href=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

    <div class="container my-5">
        <h2 class="text-center mb-4">Galeria responsiva</h2>

        <!--Adiciona espeçamento(gutter) entre as colunas-->

        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/400x250/0d6efd/ffffff?text=foto+1" class="card.img-top"alt="Foto 01">
                    <div class="card-body">
                        <h5 class="card-title">Item 01</h5>
                        <p class="card-text">Redirecione a janela do navegador para ver as colunas se reorganizando</p>
                    </div>
                </div>
            </div>


            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/400x250/198754/ffffff?text=foto+2" class="card.img-top" alt="Foto 02">
                    <div class="card-body">
                        <h5 class="card-title">Item 02</h5>
                        <p class="card-text"> A classe h-100 garante que todos os cards tenham a mesma altura</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://via.placeholder.com/400x250/dc3545/ffffff?text=foto+3" class="card.img-top" alt="Foto 03">
                    <div class="card-body">
                        <h5 class="card-title">Item 03</h5>
                        <p class="card-text">O sistema de 12 colunas facilita o alinhamento perfeito</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
